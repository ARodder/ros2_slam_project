# Initial interface sketch for offboard navigation topics.
#

# Navigation interfaces for the offboard Nav2 bringup.
#
# Active flow:
# 1. slam_toolbox runs in localization mode from a saved pose graph.
# 2. slam_toolbox publishes /map and the map->odom transform.
# 3. Nav2 consumes /map, /scan, TF, and filtered odometry.
# 4. Nav2 publishes /cmd_vel back to the JetRacer.

navigation:
  ros__parameters:
    map_topic: /map
    pose_topic: /pose
    odom_topic: /odometry/filtered
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel
    goal_topic: /goal_pose
    path_topic: /plan
    navigation_mode: localization
